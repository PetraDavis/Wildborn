<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Wildborn admin</title>
<style>
:root{--bg:#141230;--card:#1f1c45;--line:#3b3670;--text:#f1eefc;--dim:#b9b3dc;--gold:#ffd76a;--red:#ff8a8a;--green:#8fe3a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 16px}h2{font-size:17px;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:8px 12px;background:#15133a;color:var(--text)}
button{cursor:pointer;background:#2c2866}button:hover{border-color:var(--gold)}button.gold{background:var(--gold);color:#2a1e08;border-color:var(--gold);font-weight:700}
button.small{padding:4px 9px;font-size:13px}button.danger{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.dim{color:var(--dim)}.ok{color:var(--green)}.bad{color:var(--red)}.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
#msg{min-height:22px;color:var(--gold);margin:6px 0}.wrap{overflow-x:auto}
</style></head><body><main>
<h1>Wildborn admin</h1>
<section id="login"><h2>Admin key</h2><p class="dim">Type the ADMIN_KEY from Railway (Variables). It stays in this browser tab only.</p>
<div class="row"><input id="key" type="password" autocomplete="off" placeholder="Admin key" style="flex:1;min-width:200px"><button class="gold" id="go">Open</button></div></section>
<div id="msg"></div>
<div id="app" hidden>
<section><h2>Game</h2><div class="row"><span id="status"></span><button id="io"></button><button id="refresh">Refresh</button></div>
<p class="dim" id="ioTip"></p></section>
<section><h2>Invite codes</h2><div class="row"><input id="n" type="number" min="1" max="50" value="5" style="width:80px"><input id="note" maxlength="60" placeholder="Note (who it's for), optional" style="flex:1;min-width:180px"><button class="gold" id="mk">Make codes</button></div>
<div class="wrap"><table><thead><tr><th>Code</th><th>Note</th><th>Used by</th><th></th></tr></thead><tbody id="inv"></tbody></table></div></section>
<section><h2>Players</h2><div class="wrap"><table><thead><tr><th>Username</th><th>Joined</th><th>Last seen</th><th></th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><h2>Rooms right now</h2><div id="rooms" class="dim"></div></section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = t => t ? new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const ago = t => { if (!t) return ""; const m = (Date.now() - t) / 60000; return m < 2 ? "just now" : m < 60 ? Math.round(m) + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
let KEY = ""; try { KEY = sessionStorage.getItem("wbAdmin") || ""; } catch (e) {}
async function api(a, body) { const r = await fetch("/api/admin/" + a, { method: body ? "POST" : "GET", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.err || "error " + r.status); return j; }
const say = t => { $("msg").textContent = t; };
async function load() { try { const s = await api("summary"); $("login").hidden = true; $("app").hidden = false; render(s); } catch (e) { $("login").hidden = false; $("app").hidden = true; if (KEY) say(e.message); } }
let GAME = "https://petradavis.github.io/Wildborn/"; const link = c => GAME + "?invite=" + encodeURIComponent(c);
function render(s) { if (s.gameUrl) GAME = s.gameUrl;
  $("status").innerHTML = "<b>" + s.online + "</b> online &middot; " + (s.inviteOnly ? "<span class=ok>Invite only</span>" : "<span class=bad>Open to everyone</span>") + " &middot; <span class=dim>" + s.sentMB + " MB sent since " + ago(s.since) + "</span>";
  $("io").textContent = s.inviteOnly ? "Open to everyone" : "Make invite only again"; $("io").onclick = () => act("invite-only", { on: !s.inviteOnly }, s.inviteOnly ? "Open the game so anyone can make an account without a code?" : null);
  $("ioTip").textContent = s.inviteOnly ? "New players need one of the codes below to make an account." : "Anyone who finds the game can make an account. Codes aren't needed.";
  $("inv").innerHTML = s.invites.slice().reverse().map(i => "<tr><td class=code>" + esc(i.code) + "</td><td>" + esc(i.note) + (i.owner ? " <span class=dim>(" + esc(i.owner) + "'s invite)</span>" : "") + "</td><td>" + (i.usedBy ? esc(i.usedBy) : "<span class=ok>not used yet</span>") + "</td><td>" + (i.usedBy ? "" : "<button class='small' data-copy='" + esc(link(i.code)) + "'>Copy link</button> <button class='small danger' data-delinv='" + esc(i.code) + "'>Delete</button>") + "</td></tr>").join("") || "<tr><td colspan=4 class=dim>No codes yet.</td></tr>";
  $("users").innerHTML = s.users.map(u => "<tr><td><b>" + esc(u.name) + "</b> " + (u.online ? "<span class=ok>online</span>" : "") + (u.banned ? " <span class=bad>banned</span>" : "") + "</td><td>" + day(u.created) + "</td><td>" + ago(u.lastSeen) + "</td><td class=row>"
    + (u.banned ? "<button class=small data-a=unban data-n='" + esc(u.name) + "'>Unban</button>" : "<button class='small danger' data-a=ban data-n='" + esc(u.name) + "'>Ban</button>")
    + "<button class=small data-a=reset-password data-n='" + esc(u.name) + "'>New password</button><button class='small danger' data-a=delete-account data-n='" + esc(u.name) + "'>Delete</button></td></tr>").join("") || "<tr><td colspan=4 class=dim>No players yet.</td></tr>";
  $("rooms").innerHTML = s.rooms.filter(r => r.room !== "__lobby").map(r => "<div><b>" + esc(r.room.replace(/^r_/, "")) + "</b>: " + r.players.map(esc).join(", ") + "</div>").join("") || "Nobody is in a room.";
}
const ASK = { ban: n => "Ban " + n + "? They get signed out and can't sign in again until you unban them.", "delete-account": n => "Delete " + n + "'s account for good? This can't be undone.", "reset-password": n => "Make a new password for " + n + "? Their old one stops working." };
async function act(a, body, confirmText) { if (confirmText && !confirm(confirmText)) return; try { const r = await api(a, body);
  if (r.made) say("New invite links: " + r.made.map(link).join("  ")); else if (r.tempPassword) say("New password for " + body.name + ": " + r.tempPassword + "  (tell them in person; they can change it in the game)"); else say("Done."); load(); } catch (e) { say(e.message); } }
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) { navigator.clipboard.writeText(b.dataset.copy).then(() => say("Copied the invite link: " + b.dataset.copy)); }
  if (b.dataset.delinv) act("delete-invite", { code: b.dataset.delinv }, "Delete code " + b.dataset.delinv + "?");
  if (b.dataset.a) act(b.dataset.a, { name: b.dataset.n }, ASK[b.dataset.a] && ASK[b.dataset.a](b.dataset.n)); });
$("go").onclick = () => { KEY = $("key").value.trim(); try { sessionStorage.setItem("wbAdmin", KEY); } catch (e) {} say(""); load(); };
$("key").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("mk").onclick = () => act("invites", { count: +$("n").value || 1, note: $("note").value });
$("refresh").onclick = load; load();
</script></main></body></html>
